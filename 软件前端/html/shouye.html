<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动漫与特摄剧管理系统 - 首页</title>
    <link rel="stylesheet" href="../css/shouye.css">
</head>
<body>
    <!-- 左侧透明导航栏 -->
    <div class="sidebar">
        <div class="nav-item">首页</div>
        <div class="nav-item">日漫</div>
        <div class="nav-item">国漫</div>
        <div class="nav-item">美漫</div>
        <div class="nav-item">电影</div>
    </div>
    
    <!-- 背景容器 - 默认显示静音视频，交互后切换到有声音视频 -->
    <div class="background-container">
        <!-- 静音视频 (初始播放) -->
        <video class="background-video" id="mutedVideo" autoplay muted loop playsinline>
            <source src="../img/【哲风壁纸】动态壁纸-动漫-简约.mp4?v=1" type="video/mp4">
            您的浏览器不支持视频播放
        </video>
        
        <!-- 有声音视频 (交互后播放) -->
        <video class="background-video" id="soundVideo" loop playsinline style="display: none;">
            <source src="../img/chaoran.mp4" type="video/mp4">
            您的浏览器不支持视频播放
        </video>
        
        <!-- 备用背景 -->
        <div class="video-fallback">
            <div class="fallback-gradient"></div>
        </div>
        
        <!-- 视频加载指示器 -->
        <div class="video-loading" id="videoLoading">
            正在加载背景视频...
        </div>
        
        <!-- 交互提示 -->
        <div class="interaction-hint" id="interactionHint">
            点击页面任意位置启用背景声音
        </div>
        
        <div class="background-overlay"></div>
    </div>

    <!-- 轮播图模块 -->
    <div class="carousel-section">
        <div class="carousel-container" id="carousel-container">
            <!-- 轮播图内容将通过JavaScript动态生成 -->
        </div>
    </div>

    <!-- 热门推荐模块 -->
    <div class="popular-section">
        <div class="section-header">
            <h2>热门推荐 <span class="hot-icon">🔥</span></h2>
            <button class="view-more-btn">查看更多</button>
        </div>
        <div class="popular-grid" id="popular-content">
            <!-- 内容将通过JavaScript动态生成 -->
        </div>
    </div>

    <script src="../js/shouye.js?v=1.3"></script>
</body>
</html>
