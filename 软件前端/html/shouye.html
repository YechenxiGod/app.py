<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动漫与特摄剧管理系统 - 首页</title>
    <link rel="stylesheet" href="../css/shouye.css">
</head>
<body>
    <!-- 左侧透明导航栏 -->
    <div class="sidebar">
        <div class="nav-item">首页</div>
        <div class="nav-item">日漫</div>
        <div class="nav-item">台配/国配</div>
        <div class="nav-item">国漫</div>
        <div class="nav-item">美漫</div>
        <div class="nav-item">电影</div>
        <div class="nav-item">剧集</div>
    </div>
    
    <!-- 背景容器 - 默认显示静音视频，交互后切换到有声音视频 -->
    <div class="background-container">
        <!-- 静音预览视频 - 默认显示 -->
        <video class="background-video" id="previewVideo" autoplay muted loop playsinline>
            <source src="../img/【哲风壁纸】动态壁纸-动漫-简约.mp4" type="video/mp4">
            您的浏览器不支持视频播放
        </video>
        <!-- 有声音视频 - 默认隐藏 -->
        <video class="background-video" id="mainVideo" loop playsinline style="display: none;">
            <source src="../img/chaoran.mp4" type="video/mp4">
            您的浏览器不支持视频播放
        </video>
        <div class="background-overlay"></div>
    </div>

    <!-- 轮播图模块 -->
    <div class="carousel-section">
        <div class="carousel-container" id="carousel-container">
            <!-- 轮播图内容将通过JavaScript动态生成 -->
        </div>
    </div>

    <!-- 热门推荐模块 -->
    <div class="popular-section">
        <div class="section-header">
            <h2>热门推荐 <span class="hot-icon">🔥</span></h2>
            <button class="view-more-btn">查看更多</button>
        </div>
        <div class="popular-grid" id="popular-content">
            <!-- 内容将通过JavaScript动态生成 -->
        </div>
    </div>

    <script src="../js/shouye.js"></script>
</body>
</html>
